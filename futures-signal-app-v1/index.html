<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08131f">
<link rel="manifest" href="manifest.json">
<title>海外期貨紅綠燈</title>
<style>
*{box-sizing:border-box} body{margin:0;background:#08131f;color:#f4f7fb;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.app{max-width:760px;margin:auto;padding:18px 14px 90px}.head{font-size:27px;font-weight:800;text-align:center;margin:8px 0 4px}.sub{text-align:center;color:#9fb0c0;margin-bottom:18px}
.card{background:#10202e;border:1px solid #23384a;border-radius:16px;padding:15px;margin:12px 0}.banner{background:linear-gradient(135deg,#15334d,#10202e);text-align:center;font-weight:700}
.tabs{display:flex;gap:7px;overflow:auto;padding:4px 0 10px}.tab{white-space:nowrap;background:#182b3a;border:1px solid #294052;padding:9px 13px;border-radius:10px;color:#dce7ef}
.tab.active{background:#2477e8}.row{display:grid;grid-template-columns:1.25fr 1fr .9fr .8fr;align-items:center;gap:6px;padding:13px 4px;border-bottom:1px solid #223746}
.row:last-child{border:0}.sym{font-size:18px;font-weight:800}.name{font-size:12px;color:#9fb0c0}.price{font-weight:700}.dir{font-size:18px}.signal{text-align:center;font-weight:800}.green{color:#42df77}.red{color:#ff6262}.yellow{color:#ffc64d}
.dot{width:18px;height:18px;border-radius:50%;display:inline-block;vertical-align:-3px;margin-right:5px;background:currentColor;box-shadow:0 0 12px currentColor}
.note{font-size:12px;color:#91a5b5;text-align:center;margin-top:16px}
</style>
</head>
<body>
<div class="app">
<div class="head">海外期貨紅綠燈</div>
<div class="sub">iPhone 測試版 V1</div>
<div class="card banner">順勢而為・控制風險・等待訊號確認</div>
<div class="tabs">
<div class="tab active">全部</div><div class="tab">指數</div><div class="tab">外匯</div><div class="tab">金屬</div><div class="tab">穀物</div><div class="tab">能源</div>
</div>
<div class="card" id="market"></div>
<div class="note">V1 為介面測試資料。下一階段接行情 API 與你的 Pivot／紅綠燈計算規則。</div>
</div>
<script>
let data = [];

function renderMarket(){
  document.getElementById("market").innerHTML = data.map(x =>
    `<div class="row">
      <div>
        <div class="sym">${x[0]}</div>
        <div class="name">${x[1]}</div>
      </div>
      <div class="price">${x[2]}</div>
      <div class="dir">${x[3]}</div>
      <div class="signal ${x[5]}">
        <span class="dot"></span>${x[4]}
      </div>
    </div>`
  ).join("");
}

async function loadAllMarkets(){
  try{
    const response = await fetch("/api/quotes");
    const result = await response.json();

    if(!result.ok || !Array.isArray(result.quotes)) return;

    data = result.quotes.map(q => {
      const price = q.price == null
        ? "--"
        : Number(q.price).toLocaleString("en-US", {
            maximumFractionDigits: 4
          });

      let direction = "→";
      let status = "持平";
      let color = "yellow";

      if(q.price != null && q.previousClose != null){
        if(q.price > q.previousClose){
          direction = "↑";
          status = "上漲";
          color = "green";
        }else if(q.price < q.previousClose){
          direction = "↓";
          status = "下跌";
          color = "red";
        }
      }

      return [
        q.id,
        q.name,
        price,
        direction,
        status,
        color,
        q.category
      ];
    });

    renderMarket();

  }catch(error){
    console.error("完整行情載入失敗", error);
  }
}

loadAllMarkets();

if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
</script>
</body></html>
